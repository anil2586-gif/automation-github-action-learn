name: playwright test across environments and tags
on:
  push:
    branches: ['main','master']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch: 

jobs:
  playwright-matrix:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: intall dependencies
        run: npm ci
      - name: install browsers
        run: npx playwright install --with-deps
      - name: run playwright test
        run: npx playwright test
        
  playwright-test:
   name: run playwright test from other repo
   needs: playwright-matrix
   uses: anil2586-gif/learn-githubactions-sauce-demo/.github/workflows/playwright-my.yml@main
  
